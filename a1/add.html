<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth's Book Website</title>

    <!--Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/boostrap@5.3.2/dist/css/boostrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Optional Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white p-3 mb-4">
        <div class="container">
            <h1 class="m-0>Seth's Book Collection</h1>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="material-icons">menu</span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="books.html">Books</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">Add Book</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mb-5">
        <h2 class="mb-4">Add a Book</h2>

        <form id="addBookForm">

            <div class="mb-3">
                <label class="form-label">Book Title</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Author</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" required>
                    <option value="read">Read</option>
                    <option value="unread">Unread</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Cover Image</label>
                <input type="file" id="imageInput" class="form-control" accept=".png, .jpg, .jpeg" required>
            </div>

            <div class="mb-3">
                <img id="previewImage" class="img-fluid d-none rounded shadow-sm"
            </div>

            <button class="btn btn-primary">Submit</button>
        
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p class="m-0">&copy; 2026 Seth's Book Website.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js></script">
    
    <!-- My JS-->
    <script src="assets/js/scripts.js"></script>

</body>
</html>
