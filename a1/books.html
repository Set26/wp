<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth's Book Website</title>

    <!--Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/boostrap@5.3.2/dist/css/boostrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Optional Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white p-3 mb-4">
        <div class="container">
            <h1 class="m-0>Seth's Book Collection</h1>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Home</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="material-icons">menu</span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="books.html">Books</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">Add Book</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mb-5">
        <h2 class="mb-4">Book List</h2>

        <!-- Filter -->
        <div class="mb-3">
            <label class="form-label">Filter by status:</label>
            <select id="statusFilter" class="form-select">
                <option value="all">All</option>
                <option value="read">Read</option>
                <option value="unread">Unread</option>
            </select>
        </div>

        <!-- Table -->
        <table class="table table-stripped">
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="bookTable">
                <tr data-status="read">
                    <td><img src="assets/images/covers/1.png" width="60"></td>
                    <td>The Curse of Jones</td>
                    <td>RJ Schmidt</td>
                    <td>Read</td>
                </tr>

                <tr data-status="unread">
                    <td><img src="assets/images/covers/2.png" width="60"></td>
                    <td>Roanoke and Back</td>
                    <td>Mike Green</td>
                    <td>Unread</td>
                </tr>

                <tr data-status="read">
                    <td><img src="assets/images/covers/3.png" width="60"></td>
                    <td>Haro's Journey</td>
                    <td>Sid Hatrack</td>
                    <td>Read</td>
                </tr>
                
            </tbody>
        </table>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p class="m-0">&copy; 2026 Seth's Book Website.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js></script">
    
    <!-- My JS-->
    <script src="assets/js/scripts.js"></script>

</body>
</html>
